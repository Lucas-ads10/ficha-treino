<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Caverna Centro de Treinamento</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main class="login-container">

        <section class="login-card">



            <div class="seletor-tema" id="alternarTema" role="button" tabindex="0" aria-label="Alternar tema">

                <span class="icone-sol">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="4" fill="#FFC928" />
                        <g stroke="#FFC928" stroke-width="2" stroke-linecap="round">
                            <path d="M12 2v2" />
                            <path d="M12 20v2" />
                            <path d="M4.93 4.93l1.42 1.42" />
                            <path d="M17.65 17.65l1.42 1.42" />
                            <path d="M2 12h2" />
                            <path d="M20 12h2" />
                            <path d="M4.93 19.07l1.42-1.42" />
                            <path d="M17.65 6.35l1.42-1.42" />
                        </g>
                    </svg>
                </span>

                <span class="icone-lua">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z" fill="#A855F7"
                            stroke="#C084FC" stroke-width="1" />
                    </svg>
                </span>

                <span class="seletor-indicador"></span>

            </div>



            <div class="login-logo">
                <img src="../admin/logo-caverna.jpeg" alt="Caverna Centro de Treinamento">
            </div>

            <div class="login-titulo" id="tituloLogin">
                <h1>Bem-vindo!</h1>
                <p>Entre na sua conta para continuar.</p>
            </div>

            <form id="formLogin">

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                </div>

                <div class="login-opcoes">
                    <label>
                        <input type="checkbox" id="mostrarSenha">
                        Mostrar senha
                    </label>

                    <a href="#" id="esqueciSenha">Esqueci minha senha</a>
                </div>

                <button type="submit">Entrar</button>

                <p id="mensagemLogin"></p>

            </form>


            <!-- RECUPERAÇÃO DE SENHA -->

            <section id="recuperacaoSenha" hidden>

                <div class="login-titulo">
                    <h1>Recuperar senha</h1>
                    <p>Informe seu e-mail para receber o link de recuperação.</p>
                </div>

                <form id="formRecuperacao">

                    <div class="campo">
                        <label for="emailRecuperacao">E-mail cadastrado</label>

                        <input type="email" id="emailRecuperacao" placeholder="Digite seu e-mail" required>
                    </div>

                    <button type="submit">
                        Enviar link de recuperação
                    </button>

                    <p id="mensagemRecuperacao"></p>

                </form>

                <button type="button" id="abrirNovaSenha">
                    Testar definição de nova senha
                </button>

                <div class="voltar-login">
                    <a href="#" id="voltarLogin">← Voltar para o login</a>
                </div>

            </section>

            <!-- DEFINIÇÃO DE NOVA SENHA -->

            <section id="novaSenha" hidden>

                <div class="login-titulo">
                    <h1>Nova senha</h1>
                    <p>Cadastre uma nova senha para acessar sua conta.</p>
                </div>

                <form id="formNovaSenha">

                    <div class="campo">
                        <label for="senhaNova">Nova senha</label>

                        <input type="password" id="senhaNova" placeholder="Digite sua nova senha" required>
                    </div>

                    <div class="campo">
                        <label for="confirmarSenha">Confirmar nova senha</label>

                        <input type="password" id="confirmarSenha" placeholder="Confirme sua nova senha" required>
                    </div>

                    <div class="campo-opcoes">
                        <label>
                            <input type="checkbox" id="mostrarNovaSenha">
                            Mostrar senhas
                        </label>
                    </div>

                    <button type="submit">
                        Salvar nova senha
                    </button>

                    <p id="mensagemNovaSenha"></p>

                </form>

            </section>


            <footer>
                <p>Caverna Centro de Treinamento</p>
            </footer>

        </section>

    </main>

    <script src="../config.js"></script>
    <script src="script.js"></script>


</body>

</html>
