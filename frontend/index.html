<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Ficha de Treino</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- CABEÇALHO -->

    <header class="cabecalho">
        <div class="container">
            <div class="cabecalho-conteudo">

                <img src="admin/logo-caverna.jpeg" alt="Caverna Centro de Treinamento" class="logo-ficha">

                <button type="button" id="alternarTemaFicha" class="botao-tema" aria-label="Ativar tema claro">
                    <span class="tema-icone tema-sol">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round">
                            <circle cx="12" cy="12" r="4" />
                            <path d="M12 2v2 M12 20v2 M4.93 4.93l1.42 1.42
            M17.65 17.65l1.42 1.42 M2 12h2 M20 12h2
            M4.93 19.07l1.42-1.42 M17.65 6.35l1.42-1.42" />
                        </svg>
                    </span>

                    <span class="tema-icone tema-lua">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20.9 13A9 9 0 0 1 11 3.1
            9 9 0 1 0 20.9 13Z" />
                        </svg>
                    </span>

                    <span class="tema-indicador"></span>
                </button>

            </div>
        </div>
    </header>


    <!-- CONTEÚDO PRINCIPAL -->

    <main class="container">

        <!-- ESCOLHA DO TREINO -->

        <section class="selecao-treino">

            <h2>
                Escolha o treino
            </h2>

            <div class="botoes-treino">

                <button class="botao-treino ativo" data-treino="A">
                    A
                </button>

                <button class="botao-treino" data-treino="B">
                    B
                </button>

                <button class="botao-treino" data-treino="C">
                    C
                </button>

                <button class="botao-treino" data-treino="D">
                    D
                </button>

            </div>

        </section>


        <!-- TÍTULO DO TREINO -->

        <section class="titulo-treino">

            <h2 id="tituloTreino">
                Treino A
            </h2>

            <p id="descricaoTreino">
                Escolha o exercício que você vai fazer
            </p>

        </section>


        <!-- LISTA DOS EXERCÍCIOS -->

        <section id="listaExercicios">

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
