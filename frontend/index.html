<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Minha Ficha de Treino</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- CABEÇALHO -->

    <header class="cabecalho">

        <div class="container">

            <h1>🏋️ Minha Ficha de Treino</h1>

            <p>
                Controle suas cargas e repetições
            </p>

        </div>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->

    <main class="container">

        <!-- ESCOLHA DO TREINO -->

        <section class="selecao-treino">

            <h2>
                Escolha o treino
            </h2>

            <div class="botoes-treino">

                <button
                    class="botao-treino ativo"
                    data-treino="A"
                >
                    A
                </button>

                <button
                    class="botao-treino"
                    data-treino="B"
                >
                    B
                </button>

                <button
                    class="botao-treino"
                    data-treino="C"
                >
                    C
                </button>

                <button
                    class="botao-treino"
                    data-treino="D"
                >
                    D
                </button>

            </div>

        </section>


        <!-- TÍTULO DO TREINO -->

        <section class="titulo-treino">

            <h2 id="tituloTreino">
                Treino A
            </h2>

            <p id="descricaoTreino">
                Escolha o exercício que você vai fazer
            </p>

        </section>


        <!-- LISTA DOS EXERCÍCIOS -->

        <section id="listaExercicios">

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
